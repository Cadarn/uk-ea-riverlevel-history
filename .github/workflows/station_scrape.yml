name: Scrape station data daily
on:
  push:
  workflow_dispatch:
  schedule:
    - cron:    '0 1 * * *'
    
jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
    - name: Check out this repo
      uses: actions/checkout@v2
    - name: Fetch latest data
      run: |-
        curl https://environment.data.gov.uk/flood-monitoring/id/stations | jq . > stations.json
    - name: Commit and push if it changed
      run: |-
        git config user.name "Cadarn"
        git config user.email "adam.ben.hill@gmail.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "Latest station data: ${timestamp}" || exit 0
        git push
